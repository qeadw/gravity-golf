<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Golf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a1a 100%);
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            cursor: crosshair;
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 70%;
        }

        #levelInfo {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }

        .btn {
            background: linear-gradient(135deg, #4a4a6a, #2a2a4a);
            border: 1px solid #5a5a8a;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a5a8a, #3a3a5a);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background: linear-gradient(135deg, #6a4a8a, #4a2a6a);
            border-color: #8a5aaa;
        }

        #wellCounter {
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 13px;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            max-width: 90%;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #message.show {
            opacity: 1;
        }

        #message.win {
            color: #4ade80;
        }

        #message.fail {
            color: #f87171;
        }

        #levelSelect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 26, 0.98);
            border: 2px solid #4a4a6a;
            border-radius: 12px;
            padding: 30px;
            display: none;
            z-index: 100;
            max-height: 90vh;
            overflow-y: auto;
        }

        #levelSelect.show {
            display: block;
        }

        #levelSelect h2 {
            margin-bottom: 10px;
            text-align: center;
        }

        .pod-label {
            font-size: 14px;
            color: #888;
            margin: 15px 0 8px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .level-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            padding: 0;
        }

        .level-btn.completed {
            background: linear-gradient(135deg, #2a6a4a, #1a4a2a);
            border-color: #4a8a6a;
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-btn.boss {
            border-color: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }

        .level-btn.challenge {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

</head>

            <button class="btn" style="margin-top: 20px; width: 100%;" id="closeLevelSelect">Close</button>

        // ============================================
        // BALL CLASS
        // ============================================
        class Ball {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 10;
                this.launched = false;
            }

            launch(angle, power) {
                const rad = angle * Math.PI / 180;
                this.vx = Math.cos(rad) * power;
                this.vy = Math.sin(rad) * power;
                this.launched = true;
            }

            update(wells, blackHoles) {
                if (!this.launched) return;

                // Apply gravity from player wells
                for (const well of wells) {
                    const dx = well.x - this.x;
                    const dy = well.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 10) {
                        const force = well.strength / (dist * dist) * (well.type === 'attractor' ? 1 : -1);
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                // Apply gravity from black holes
                for (const bh of blackHoles) {
                    const dx = bh.x - this.x;
                    const dy = bh.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 10) {
                        const force = bh.strength / (dist * dist);
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                // Apply friction
                this.vx *= PHYSICS.friction;
                this.vy *= PHYSICS.friction;

                // Clamp speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > PHYSICS.maxSpeed) {
                    this.vx = (this.vx / speed) * PHYSICS.maxSpeed;
                    this.vy = (this.vy / speed) * PHYSICS.maxSpeed;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.8;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.8;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -0.8;
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -0.8;
                }
            }

            draw() {
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(0.5, 'rgba(200, 200, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(100, 100, 255, 0)');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            isStopped() {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                return speed < PHYSICS.minSpeed;
            }
        }

        // ============================================
        // GRAVITY WELL CLASS
        // ============================================
        class GravityWell {
            constructor(x, y, type = 'attractor', strength = PHYSICS.wellStrengthDefault) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.strength = strength;
                this.radius = 20;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            draw() {
                const pulse = Math.sin(this.pulsePhase + Date.now() / 200) * 0.2 + 1;
                const visualRadius = this.radius * pulse;
                const strengthRatio = (this.strength - PHYSICS.wellStrengthMin) /
                                     (PHYSICS.wellStrengthMax - PHYSICS.wellStrengthMin);
                const fieldRadius = 50 + strengthRatio * 100;

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, fieldRadius);
                if (this.type === 'attractor') {
                    gradient.addColorStop(0, 'rgba(100, 150, 255, 0.3)');
                    gradient.addColorStop(1, 'rgba(100, 150, 255, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 100, 100, 0.3)');
                    gradient.addColorStop(1, 'rgba(255, 100, 100, 0)');
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, fieldRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, visualRadius, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'attractor' ? '#4a9eff' : '#ff6b6b';
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'attractor' ? '+' : '-', this.x, this.y);

                ctx.font = '10px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(Math.round(this.strength), this.x, this.y + visualRadius + 12);
            }

            contains(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius + 10;
            }
        }

        // ============================================
        // GAME FUNCTIONS
        // ============================================
        function getPod(levelIndex) {
            return Math.floor(levelIndex / 10);
        }

        function resizeCanvas(levelIndex) {
            const pod = getPod(levelIndex);
            const size = CANVAS_SIZES[pod] || CANVAS_SIZES[5];
            canvas.width = size.width;
            canvas.height = size.height;
        }

        function loadLevel(index) {
            const level = levels[index];
            state.currentLevel = index;

            resizeCanvas(index);

            state.ball = new Ball(level.ball.x, level.ball.y);
            state.goal = { ...level.goal };
            state.obstacles = (level.obstacles || []).map(o => ({ ...o }));
            state.movingObstacles = (level.movingObstacles || []).map(o => ({
                ...o,
                originalX: o.x,
                originalY: o.y,
                phase: o.phase || 0
            }));
            state.blackHoles = (level.blackHoles || []).map(bh => ({ ...bh }));
            state.portals = (level.portals || []).map(p => ({ ...p }));
            state.bumpers = (level.bumpers || []).map(b => ({ ...b }));
            state.wells = [];
            state.maxWells = state.cheatsEnabled ? 999 : level.maxWells;
            state.ballLaunched = false;
            state.gameOver = false;
            state.trail = [];
            state.gameTime = 0;
            state.lastTime = 0;
            state.accumulator = 0;

            document.getElementById('currentLevel').textContent = index + 1;

            // Hide instructions after first level
            const instructions = document.getElementById('instructions');
            instructions.style.display = index > 0 ? 'none' : 'block';
            document.getElementById('podName').textContent = POD_NAMES[getPod(index)];
            document.getElementById('obstacleHint').innerHTML = POD_HINTS[getPod(index)];
            updateWellCounter();
            hideMessage();
        }

        function resetLevel() {
            const level = levels[state.currentLevel];
            state.ball = new Ball(level.ball.x, level.ball.y);
            state.ballLaunched = false;
            state.gameOver = false;
            state.trail = [];
            state.gameTime = 0;
            state.lastTime = 0;
            state.accumulator = 0;

            // Reset moving obstacles
            state.movingObstacles = (level.movingObstacles || []).map(o => ({
                ...o,
                originalX: o.x,
                originalY: o.y,
                phase: o.phase || 0
            }));

            hideMessage();
        }

        function launchBall() {
            if (state.ballLaunched) return;

            const level = levels[state.currentLevel];
            state.ball.launch(level.launchAngle, level.launchPower);
            state.ballLaunched = true;
        }

        function updateMovingObstacles() {
            for (const obs of state.movingObstacles) {
                const offset = Math.sin(state.gameTime * obs.speed * 0.01 + (obs.phase || 0)) * obs.range / 2;
                if (obs.axis === 'x') {
                    obs.x = obs.originalX + offset;
                } else {
                    obs.y = obs.originalY + offset;
                }
            }
        }

        function checkPortalCollision() {
            for (const portal of state.portals) {
                const dx1 = state.ball.x - portal.x1;
                const dy1 = state.ball.y - portal.y1;
                const dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);

                if (dist1 < state.ball.radius + portal.radius) {
                    state.ball.x = portal.x2;
                    state.ball.y = portal.y2;
                    return;
                }

                const dx2 = state.ball.x - portal.x2;
                const dy2 = state.ball.y - portal.y2;
                const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

                if (dist2 < state.ball.radius + portal.radius) {
                    state.ball.x = portal.x1;
                    state.ball.y = portal.y1;
                    return;
                }
            }
        }

        function checkBumperCollision() {
            for (const bumper of state.bumpers) {
                const dx = state.ball.x - bumper.x;
                const dy = state.ball.y - bumper.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < state.ball.radius + bumper.radius) {
                    // Bounce off bumper
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // Move ball outside bumper
                    state.ball.x = bumper.x + nx * (state.ball.radius + bumper.radius + 1);
                    state.ball.y = bumper.y + ny * (state.ball.radius + bumper.radius + 1);

                    // Reflect velocity and add force
                    const dot = state.ball.vx * nx + state.ball.vy * ny;
                    state.ball.vx = (state.ball.vx - 2 * dot * nx) + nx * PHYSICS.bumperForce;
                    state.ball.vy = (state.ball.vy - 2 * dot * ny) + ny * PHYSICS.bumperForce;
                }
            }
        }

        function checkCollisions() {
            if (state.gameOver) return;

            const ball = state.ball;

            // Check goal
            const gdx = ball.x - state.goal.x;
            const gdy = ball.y - state.goal.y;
            const gDist = Math.sqrt(gdx * gdx + gdy * gdy);

            if (gDist < ball.radius + state.goal.radius) {
                state.gameOver = true;
                onWin();
                return;
            }

            // Check black holes (instant death)
            for (const bh of state.blackHoles) {
                const dx = ball.x - bh.x;
                const dy = ball.y - bh.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < ball.radius + bh.radius) {
                    state.gameOver = true;
                    onFail();
                    return;
                }
            }

            // Check static obstacles
            for (const obs of state.obstacles) {
                if (ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y &&
                    ball.y - ball.radius < obs.y + obs.height) {
                    state.gameOver = true;
                    onFail();
                    return;
                }
            }

            // Check moving obstacles
            for (const obs of state.movingObstacles) {
                if (ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y &&
                    ball.y - ball.radius < obs.y + obs.height) {
                    state.gameOver = true;
                    onFail();
                    return;
                }
            }

            // Check portals
            checkPortalCollision();

            // Check bumpers
            checkBumperCollision();

            // Check if ball stopped
            if (ball.launched && ball.isStopped()) {
                state.gameOver = true;
                onFail();
            }
        }

        function onWin() {
            state.completedLevels.add(state.currentLevel);
            showMessage('NICE!', 'win');

            setTimeout(() => {
                if (state.currentLevel < levels.length - 1) {
                    loadLevel(state.currentLevel + 1);
                } else {
                    showMessage('YOU WIN!', 'win');
                }
            }, 1500);
        }

        function onFail() {
            showMessage('MISS!', 'fail');
            setTimeout(resetLevel, 1000);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'show ' + type;
        }

        function hideMessage() {
            document.getElementById('message').className = '';
        }

        function updateWellCounter() {
            document.getElementById('wellCounter').textContent =
                `Wells: ${state.wells.length} / ${state.maxWells}`;
        }

        // ============================================
        // RENDERING
        // ============================================
        function drawGoal() {
            const goal = state.goal;

            const gradient = ctx.createRadialGradient(goal.x, goal.y, 0, goal.x, goal.y, goal.radius * 1.5);
            gradient.addColorStop(0, 'rgba(74, 222, 128, 0.6)');
            gradient.addColorStop(1, 'rgba(74, 222, 128, 0)');

            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(74, 222, 128, 0.3)';
            ctx.fill();
        }

        function drawObstacles() {
            // Static obstacles
            for (const obs of state.obstacles) {
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff6666';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Moving obstacles
            for (const obs of state.movingObstacles) {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffcc44';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }
        }

        function drawBlackHoles() {
            for (const bh of state.blackHoles) {
                // Accretion disk effect
                const gradient = ctx.createRadialGradient(bh.x, bh.y, bh.radius * 0.5, bh.x, bh.y, bh.radius * 3);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
                gradient.addColorStop(0.3, 'rgba(80, 0, 120, 0.8)');
                gradient.addColorStop(0.6, 'rgba(120, 0, 180, 0.4)');
                gradient.addColorStop(1, 'rgba(80, 0, 120, 0)');

                ctx.beginPath();
                ctx.arc(bh.x, bh.y, bh.radius * 3, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Event horizon
                ctx.beginPath();
                ctx.arc(bh.x, bh.y, bh.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.strokeStyle = '#8800ff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Singularity
                ctx.beginPath();
                ctx.arc(bh.x, bh.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
        }

        function drawPortals() {
            for (const portal of state.portals) {
                const time = Date.now() / 500;

                // Portal 1
                const gradient1 = ctx.createRadialGradient(portal.x1, portal.y1, 0, portal.x1, portal.y1, portal.radius * 1.5);
                gradient1.addColorStop(0, 'rgba(0, 255, 170, 0.8)');
                gradient1.addColorStop(0.5, 'rgba(0, 200, 150, 0.4)');
                gradient1.addColorStop(1, 'rgba(0, 255, 170, 0)');

                ctx.beginPath();
                ctx.arc(portal.x1, portal.y1, portal.radius * (1.2 + Math.sin(time) * 0.1), 0, Math.PI * 2);
                ctx.fillStyle = gradient1;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(portal.x1, portal.y1, portal.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ffaa';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Portal 2
                const gradient2 = ctx.createRadialGradient(portal.x2, portal.y2, 0, portal.x2, portal.y2, portal.radius * 1.5);
                gradient2.addColorStop(0, 'rgba(0, 255, 170, 0.8)');
                gradient2.addColorStop(0.5, 'rgba(0, 200, 150, 0.4)');
                gradient2.addColorStop(1, 'rgba(0, 255, 170, 0)');

                ctx.beginPath();
                ctx.arc(portal.x2, portal.y2, portal.radius * (1.2 + Math.sin(time + Math.PI) * 0.1), 0, Math.PI * 2);
                ctx.fillStyle = gradient2;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(portal.x2, portal.y2, portal.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ffaa';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Connection line
                ctx.beginPath();
                ctx.moveTo(portal.x1, portal.y1);
                ctx.lineTo(portal.x2, portal.y2);
                ctx.strokeStyle = 'rgba(0, 255, 170, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 10]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawBumpers() {
            for (const bumper of state.bumpers) {
                const time = Date.now() / 300;
                const pulse = 1 + Math.sin(time) * 0.1;

                // Glow
                const gradient = ctx.createRadialGradient(bumper.x, bumper.y, 0, bumper.x, bumper.y, bumper.radius * 1.5);
                gradient.addColorStop(0, 'rgba(0, 170, 255, 0.6)');
                gradient.addColorStop(1, 'rgba(0, 170, 255, 0)');

                ctx.beginPath();
                ctx.arc(bumper.x, bumper.y, bumper.radius * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Bumper
                ctx.beginPath();
                ctx.arc(bumper.x, bumper.y, bumper.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#00aaff';
                ctx.fill();
                ctx.strokeStyle = '#00ddff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Inner ring
                ctx.beginPath();
                ctx.arc(bumper.x, bumper.y, bumper.radius * 0.6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawTrail() {
            if (state.trail.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(state.trail[0].x, state.trail[0].y);

            for (let i = 1; i < state.trail.length; i++) {
                ctx.lineTo(state.trail[i].x, state.trail[i].y);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawLaunchIndicator() {
            if (state.ballLaunched) return;

            const ball = state.ball;
            const level = levels[state.currentLevel];
            const rad = level.launchAngle * Math.PI / 180;
            const length = level.launchPower * 10;

            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(
                ball.x + Math.cos(rad) * length,
                ball.y + Math.sin(rad) * length
            );
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            const arrowX = ball.x + Math.cos(rad) * length;
            const arrowY = ball.y + Math.sin(rad) * length;

            ctx.beginPath();
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(
                arrowX - Math.cos(rad - 0.3) * 10,
                arrowY - Math.sin(rad - 0.3) * 10
            );
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(
                arrowX - Math.cos(rad + 0.3) * 10,
                arrowY - Math.sin(rad + 0.3) * 10
            );
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
        }

        function drawStars() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 80; i++) {
                const x = (i * 73 + state.currentLevel * 17) % canvas.width;
                const y = (i * 137 + state.currentLevel * 23) % canvas.height;
                const size = (i % 3) + 1;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawStars();
            drawGoal();
            drawObstacles();
            drawBlackHoles();
            drawPortals();
            drawBumpers();
            drawTrail();

            for (const well of state.wells) {
                well.draw();
            }

            drawLaunchIndicator();

            if (state.ball) {
                state.ball.draw();
            }
        }

        function fixedUpdate() {
            if (state.ball && state.ball.launched && !state.gameOver) {
                state.gameTime++;
                updateMovingObstacles();
                state.ball.update(state.wells, state.blackHoles);

                state.trail.push({ x: state.ball.x, y: state.ball.y });
                if (state.trail.length > state.maxTrailLength) {
                    state.trail.shift();
                }

                checkCollisions();
            } else if (!state.ballLaunched) {
                // Still update moving obstacles for preview
                state.gameTime++;
                updateMovingObstacles();
            }
        }

        function gameLoop(currentTime) {
            if (state.lastTime === 0) {
                state.lastTime = currentTime;
            }

            const deltaTime = currentTime - state.lastTime;
            state.lastTime = currentTime;

            state.accumulator += deltaTime;

            if (state.accumulator > 200) {
                state.accumulator = 200;
            }

            while (state.accumulator >= FIXED_TIMESTEP) {
                fixedUpdate();
                state.accumulator -= FIXED_TIMESTEP;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        document.getElementById('launchBtn').addEventListener('click', launchBall);
        document.getElementById('resetBtn').addEventListener('click', resetLevel);

        document.getElementById('attractorBtn').addEventListener('click', () => {
            state.wellMode = 'attractor';
            document.getElementById('attractorBtn').classList.add('active');
            document.getElementById('repulsorBtn').classList.remove('active');
        });

        document.getElementById('repulsorBtn').addEventListener('click', () => {
            state.wellMode = 'repulsor';
            document.getElementById('repulsorBtn').classList.add('active');
            document.getElementById('attractorBtn').classList.remove('active');
        });

        document.getElementById('clearWellsBtn').addEventListener('click', () => {
            state.wells = [];
            updateWellCounter();
        });

        document.getElementById('levelSelectBtn').addEventListener('click', () => {
            updateLevelGrid();
            document.getElementById('levelSelect').classList.add('show');
        });

        document.getElementById('closeLevelSelect').addEventListener('click', () => {
            document.getElementById('levelSelect').classList.remove('show');
        });

        canvas.addEventListener('click', (e) => {
            if (state.ballLaunched) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = state.wells.length - 1; i >= 0; i--) {
                if (state.wells[i].contains(x, y)) {
                    state.selectedWell = state.wells[i];
                    return;
                }
            }

            if (state.wells.length < state.maxWells) {
                const well = new GravityWell(x, y, state.wellMode);
                state.wells.push(well);
                state.selectedWell = well;
                updateWellCounter();
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = state.wells.length - 1; i >= 0; i--) {
                if (state.wells[i].contains(x, y)) {
                    state.wells.splice(i, 1);
                    updateWellCounter();
                    return;
                }
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (const well of state.wells) {
                if (well.contains(x, y)) {
                    well.strength += e.deltaY > 0 ? -20 : 20;
                    well.strength = Math.max(PHYSICS.wellStrengthMin,
                                   Math.min(PHYSICS.wellStrengthMax, well.strength));
                    return;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                launchBall();
            } else if (e.code === 'KeyR') {
                resetLevel();
            }

            // Cheat code detection
            if (e.key.length === 1) {
                state.cheatBuffer += e.key.toLowerCase();
                if (state.cheatBuffer.length > 7) {
                    state.cheatBuffer = state.cheatBuffer.slice(-7);
                }
                if (state.cheatBuffer === 'cheater') {
                    state.cheatsEnabled = !state.cheatsEnabled;
                    state.cheatBuffer = '';
                    if (state.cheatsEnabled) {
                        state.maxWells = 999;
                        document.getElementById('wellCounter').style.color = '#ffd700';
                        console.log('Cheats enabled: Infinite wells, all levels unlocked');
                    } else {
                        state.maxWells = levels[state.currentLevel].maxWells;
                        document.getElementById('wellCounter').style.color = '';
                        console.log('Cheats disabled');
                    }
                    updateWellCounter();
                }
            }
        });

        function updateLevelGrid() {
            const container = document.getElementById('levelGridContainer');
            container.innerHTML = '';

            for (let pod = 0; pod < 6; pod++) {
                const label = document.createElement('div');
                label.className = 'pod-label';
                label.textContent = `${POD_NAMES[pod]} (${pod * 10 + 1}-${pod * 10 + 10})`;
                container.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'level-grid';

                for (let i = 0; i < 10; i++) {
                    const levelIndex = pod * 10 + i;
                    if (levelIndex >= levels.length) break;

                    const level = levels[levelIndex];
                    const btn = document.createElement('button');
                    btn.className = 'btn level-btn';
                    btn.textContent = levelIndex + 1;

                    if (state.completedLevels.has(levelIndex)) {
                        btn.classList.add('completed');
                    }

                    if (level.isBoss) {
                        btn.classList.add('boss');
                    }

                    if (level.isChallenge && !level.isBoss) {
                        btn.classList.add('challenge');
                    }

                    const isUnlocked = state.cheatsEnabled ||
                                      levelIndex === 0 ||
                                      state.completedLevels.has(levelIndex - 1) ||
                                      state.completedLevels.has(levelIndex);

                    if (!isUnlocked) {
                        btn.classList.add('locked');
                    } else {
                        btn.addEventListener('click', () => {
                            loadLevel(levelIndex);
                            document.getElementById('levelSelect').classList.remove('show');
                        });
                    }

                    grid.appendChild(btn);
                }

                container.appendChild(grid);
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.getElementById('attractorBtn').classList.add('active');
        loadLevel(0);
        requestAnimationFrame(gameLoop);

        console.log('Gravity Golf loaded! 60 levels of gravitational puzzle action.');
    </script>
</body>
</html>
