<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Golf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a1a 100%);
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #levelInfo {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
        }

        .btn {
            background: linear-gradient(135deg, #4a4a6a, #2a2a4a);
            border: 1px solid #5a5a8a;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a5a8a, #3a3a5a);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background: linear-gradient(135deg, #6a4a8a, #4a2a6a);
            border-color: #8a5aaa;
        }

        #wellCounter {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            max-width: 600px;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #message.show {
            opacity: 1;
        }

        #message.win {
            color: #4ade80;
        }

        #message.fail {
            color: #f87171;
        }

        .mode-indicator {
            font-size: 12px;
            color: #888;
            margin-left: 10px;
        }

        #levelSelect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #4a4a6a;
            border-radius: 12px;
            padding: 30px;
            display: none;
            z-index: 100;
        }

        #levelSelect.show {
            display: block;
        }

        #levelSelect h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .level-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        .level-btn.completed {
            background: linear-gradient(135deg, #2a6a4a, #1a4a2a);
            border-color: #4a8a6a;
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>

        <div id="ui">
            <button class="btn" id="launchBtn">Launch</button>
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn" id="attractorBtn">Attractor</button>
            <button class="btn" id="repulsorBtn">Repulsor</button>
            <button class="btn" id="clearWellsBtn">Clear Wells</button>
            <span id="wellCounter">Wells: 0 / 5</span>
            <span class="mode-indicator" id="modeIndicator">Click canvas to place well</span>
        </div>

        <div id="levelInfo">
            <div>Level <span id="currentLevel">1</span></div>
            <button class="btn" id="levelSelectBtn" style="margin-top: 5px;">Levels</button>
        </div>

        <div id="instructions">
            Place gravity wells to guide the ball to the green goal.
            <strong>Attractors</strong> (blue) pull the ball, <strong>Repulsors</strong> (red) push it away.
            Scroll wheel adjusts well strength. Avoid red obstacles!
        </div>

        <div id="message"></div>

        <div id="levelSelect">
            <h2>Select Level</h2>
            <div class="level-grid" id="levelGrid"></div>
            <button class="btn" style="margin-top: 20px; width: 100%;" id="closeLevelSelect">Close</button>
        </div>
    </div>

    <script>
        // ============================================
        // GRAVITY GOLF - A Physics Puzzle Game
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        const state = {
            ball: null,
            goal: null,
            obstacles: [],
            wells: [],
            isLaunching: false,
            ballLaunched: false,
            currentLevel: 0,
            completedLevels: new Set(),
            maxWells: 5,
            wellMode: 'attractor', // 'attractor' or 'repulsor'
            selectedWell: null,
            trail: [],
            maxTrailLength: 50
        };

        // Physics constants
        const PHYSICS = {
            gravity: 0,
            friction: 0.999,
            minSpeed: 0.1,
            maxSpeed: 15,
            wellStrengthMin: 50,
            wellStrengthMax: 300,
            wellStrengthDefault: 150
        };

        // ============================================
        // LEVEL DEFINITIONS
        // ============================================
        const levels = [
            {
                name: "First Steps",
                ball: { x: 100, y: 300 },
                goal: { x: 800, y: 300, radius: 30 },
                obstacles: [],
                maxWells: 3,
                launchAngle: 0,
                launchPower: 5
            },
            {
                name: "Over the Wall",
                ball: { x: 100, y: 500 },
                goal: { x: 800, y: 500, radius: 30 },
                obstacles: [
                    { x: 450, y: 350, width: 30, height: 300 }
                ],
                maxWells: 3,
                launchAngle: -30,
                launchPower: 6
            },
            {
                name: "The Gap",
                ball: { x: 100, y: 300 },
                goal: { x: 800, y: 300, radius: 30 },
                obstacles: [
                    { x: 400, y: 0, width: 30, height: 200 },
                    { x: 400, y: 350, width: 30, height: 250 }
                ],
                maxWells: 4,
                launchAngle: 0,
                launchPower: 5
            },
            {
                name: "Maze Runner",
                ball: { x: 80, y: 100 },
                goal: { x: 820, y: 500, radius: 30 },
                obstacles: [
                    { x: 200, y: 0, width: 20, height: 400 },
                    { x: 400, y: 200, width: 20, height: 400 },
                    { x: 600, y: 0, width: 20, height: 400 }
                ],
                maxWells: 5,
                launchAngle: 0,
                launchPower: 4
            },
            {
                name: "Spiral",
                ball: { x: 450, y: 50 },
                goal: { x: 450, y: 550, radius: 30 },
                obstacles: [
                    { x: 200, y: 150, width: 400, height: 20 },
                    { x: 300, y: 300, width: 400, height: 20 },
                    { x: 200, y: 450, width: 400, height: 20 }
                ],
                maxWells: 5,
                launchAngle: 90,
                launchPower: 3
            },
            {
                name: "The Gauntlet",
                ball: { x: 50, y: 300 },
                goal: { x: 850, y: 300, radius: 25 },
                obstacles: [
                    { x: 200, y: 200, width: 20, height: 100 },
                    { x: 200, y: 350, width: 20, height: 100 },
                    { x: 400, y: 150, width: 20, height: 150 },
                    { x: 400, y: 350, width: 20, height: 150 },
                    { x: 600, y: 200, width: 20, height: 100 },
                    { x: 600, y: 350, width: 20, height: 100 }
                ],
                maxWells: 6,
                launchAngle: 0,
                launchPower: 4
            },
            {
                name: "Pinball",
                ball: { x: 100, y: 550 },
                goal: { x: 800, y: 50, radius: 25 },
                obstacles: [
                    { x: 250, y: 100, width: 80, height: 20 },
                    { x: 450, y: 200, width: 80, height: 20 },
                    { x: 250, y: 300, width: 80, height: 20 },
                    { x: 450, y: 400, width: 80, height: 20 },
                    { x: 650, y: 300, width: 80, height: 20 }
                ],
                maxWells: 5,
                launchAngle: -45,
                launchPower: 6
            },
            {
                name: "Orbit",
                ball: { x: 450, y: 100 },
                goal: { x: 450, y: 500, radius: 25 },
                obstacles: [
                    { x: 350, y: 250, width: 200, height: 100 }
                ],
                maxWells: 3,
                launchAngle: 45,
                launchPower: 5,
                hint: "Try creating an orbit around the obstacle"
            },
            {
                name: "Tight Squeeze",
                ball: { x: 50, y: 50 },
                goal: { x: 850, y: 550, radius: 20 },
                obstacles: [
                    { x: 150, y: 100, width: 600, height: 20 },
                    { x: 150, y: 200, width: 20, height: 300 },
                    { x: 250, y: 200, width: 500, height: 20 },
                    { x: 730, y: 200, width: 20, height: 200 },
                    { x: 250, y: 380, width: 500, height: 20 },
                    { x: 250, y: 380, width: 20, height: 150 }
                ],
                maxWells: 6,
                launchAngle: 0,
                launchPower: 3
            },
            {
                name: "Grand Finale",
                ball: { x: 50, y: 300 },
                goal: { x: 850, y: 300, radius: 20 },
                obstacles: [
                    { x: 200, y: 0, width: 15, height: 250 },
                    { x: 200, y: 350, width: 15, height: 250 },
                    { x: 350, y: 100, width: 15, height: 200 },
                    { x: 350, y: 400, width: 15, height: 200 },
                    { x: 500, y: 0, width: 15, height: 200 },
                    { x: 500, y: 300, width: 15, height: 100 },
                    { x: 500, y: 500, width: 15, height: 100 },
                    { x: 650, y: 150, width: 15, height: 300 },
                    { x: 750, y: 0, width: 15, height: 200 },
                    { x: 750, y: 400, width: 15, height: 200 }
                ],
                maxWells: 8,
                launchAngle: 0,
                launchPower: 3
            }
        ];

        // ============================================
        // BALL CLASS
        // ============================================
        class Ball {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 10;
                this.launched = false;
            }

            launch(angle, power) {
                const rad = angle * Math.PI / 180;
                this.vx = Math.cos(rad) * power;
                this.vy = Math.sin(rad) * power;
                this.launched = true;
            }

            update(wells) {
                if (!this.launched) return;

                // Apply gravity from wells
                for (const well of wells) {
                    const dx = well.x - this.x;
                    const dy = well.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 10) {
                        const force = well.strength / (dist * dist) * (well.type === 'attractor' ? 1 : -1);
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                // Apply friction
                this.vx *= PHYSICS.friction;
                this.vy *= PHYSICS.friction;

                // Clamp speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > PHYSICS.maxSpeed) {
                    this.vx = (this.vx / speed) * PHYSICS.maxSpeed;
                    this.vy = (this.vy / speed) * PHYSICS.maxSpeed;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.8;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.8;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -0.8;
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -0.8;
                }
            }

            draw() {
                // Glow effect
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(0.5, 'rgba(200, 200, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(100, 100, 255, 0)');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Ball
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            isStopped() {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                return speed < PHYSICS.minSpeed;
            }
        }

        // ============================================
        // GRAVITY WELL CLASS
        // ============================================
        class GravityWell {
            constructor(x, y, type = 'attractor', strength = PHYSICS.wellStrengthDefault) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.strength = strength;
                this.radius = 20;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            draw() {
                const pulse = Math.sin(this.pulsePhase + Date.now() / 200) * 0.2 + 1;
                const visualRadius = this.radius * pulse;
                const strengthRatio = (this.strength - PHYSICS.wellStrengthMin) /
                                     (PHYSICS.wellStrengthMax - PHYSICS.wellStrengthMin);
                const fieldRadius = 50 + strengthRatio * 100;

                // Field visualization
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, fieldRadius);
                if (this.type === 'attractor') {
                    gradient.addColorStop(0, 'rgba(100, 150, 255, 0.3)');
                    gradient.addColorStop(1, 'rgba(100, 150, 255, 0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 100, 100, 0.3)');
                    gradient.addColorStop(1, 'rgba(255, 100, 100, 0)');
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, fieldRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, visualRadius, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'attractor' ? '#4a9eff' : '#ff6b6b';
                ctx.fill();

                // Symbol
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'attractor' ? '+' : '-', this.x, this.y);

                // Strength indicator
                ctx.font = '10px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(Math.round(this.strength), this.x, this.y + visualRadius + 12);
            }

            contains(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius + 10;
            }
        }

        // ============================================
        // GAME FUNCTIONS
        // ============================================
        function loadLevel(index) {
            const level = levels[index];
            state.currentLevel = index;
            state.ball = new Ball(level.ball.x, level.ball.y);
            state.goal = { ...level.goal };
            state.obstacles = level.obstacles.map(o => ({ ...o }));
            state.wells = [];
            state.maxWells = level.maxWells;
            state.ballLaunched = false;
            state.trail = [];

            document.getElementById('currentLevel').textContent = index + 1;
            updateWellCounter();
            hideMessage();
        }

        function resetLevel() {
            const level = levels[state.currentLevel];
            state.ball = new Ball(level.ball.x, level.ball.y);
            state.ballLaunched = false;
            state.trail = [];
            hideMessage();
        }

        function launchBall() {
            if (state.ballLaunched) return;

            const level = levels[state.currentLevel];
            state.ball.launch(level.launchAngle, level.launchPower);
            state.ballLaunched = true;
        }

        function checkCollisions() {
            const ball = state.ball;

            // Check goal
            const dx = ball.x - state.goal.x;
            const dy = ball.y - state.goal.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < ball.radius + state.goal.radius) {
                onWin();
                return;
            }

            // Check obstacles
            for (const obs of state.obstacles) {
                if (ball.x + ball.radius > obs.x &&
                    ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y &&
                    ball.y - ball.radius < obs.y + obs.height) {
                    onFail();
                    return;
                }
            }

            // Check if ball stopped
            if (ball.launched && ball.isStopped()) {
                onFail();
            }
        }

        function onWin() {
            state.completedLevels.add(state.currentLevel);
            showMessage('NICE!', 'win');

            setTimeout(() => {
                if (state.currentLevel < levels.length - 1) {
                    loadLevel(state.currentLevel + 1);
                } else {
                    showMessage('YOU WIN!', 'win');
                }
            }, 1500);
        }

        function onFail() {
            showMessage('MISS!', 'fail');
            setTimeout(resetLevel, 1000);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'show ' + type;
        }

        function hideMessage() {
            document.getElementById('message').className = '';
        }

        function updateWellCounter() {
            document.getElementById('wellCounter').textContent =
                `Wells: ${state.wells.length} / ${state.maxWells}`;
        }

        // ============================================
        // RENDERING
        // ============================================
        function drawGoal() {
            const goal = state.goal;

            // Outer glow
            const gradient = ctx.createRadialGradient(goal.x, goal.y, 0, goal.x, goal.y, goal.radius * 1.5);
            gradient.addColorStop(0, 'rgba(74, 222, 128, 0.6)');
            gradient.addColorStop(1, 'rgba(74, 222, 128, 0)');

            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Goal circle
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Inner circle
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(74, 222, 128, 0.3)';
            ctx.fill();
        }

        function drawObstacles() {
            for (const obs of state.obstacles) {
                // Glow
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 15;

                ctx.fillStyle = '#ff4444';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                ctx.shadowBlur = 0;

                // Border
                ctx.strokeStyle = '#ff6666';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }
        }

        function drawTrail() {
            if (state.trail.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(state.trail[0].x, state.trail[0].y);

            for (let i = 1; i < state.trail.length; i++) {
                ctx.lineTo(state.trail[i].x, state.trail[i].y);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawLaunchIndicator() {
            if (state.ballLaunched) return;

            const ball = state.ball;
            const level = levels[state.currentLevel];
            const rad = level.launchAngle * Math.PI / 180;
            const length = level.launchPower * 10;

            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(
                ball.x + Math.cos(rad) * length,
                ball.y + Math.sin(rad) * length
            );
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Arrow head
            const arrowX = ball.x + Math.cos(rad) * length;
            const arrowY = ball.y + Math.sin(rad) * length;

            ctx.beginPath();
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(
                arrowX - Math.cos(rad - 0.3) * 10,
                arrowY - Math.sin(rad - 0.3) * 10
            );
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(
                arrowX - Math.cos(rad + 0.3) * 10,
                arrowY - Math.sin(rad + 0.3) * 10
            );
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
        }

        function drawStars() {
            // Simple star field background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 73) % canvas.width;
                const y = (i * 137) % canvas.height;
                const size = (i % 3) + 1;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function render() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background stars
            drawStars();

            // Game elements
            drawGoal();
            drawObstacles();
            drawTrail();

            // Wells
            for (const well of state.wells) {
                well.draw();
            }

            // Launch indicator
            drawLaunchIndicator();

            // Ball
            if (state.ball) {
                state.ball.draw();
            }
        }

        function update() {
            if (state.ball && state.ball.launched) {
                state.ball.update(state.wells);

                // Add to trail
                state.trail.push({ x: state.ball.x, y: state.ball.y });
                if (state.trail.length > state.maxTrailLength) {
                    state.trail.shift();
                }

                checkCollisions();
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        document.getElementById('launchBtn').addEventListener('click', launchBall);
        document.getElementById('resetBtn').addEventListener('click', resetLevel);

        document.getElementById('attractorBtn').addEventListener('click', () => {
            state.wellMode = 'attractor';
            document.getElementById('attractorBtn').classList.add('active');
            document.getElementById('repulsorBtn').classList.remove('active');
        });

        document.getElementById('repulsorBtn').addEventListener('click', () => {
            state.wellMode = 'repulsor';
            document.getElementById('repulsorBtn').classList.add('active');
            document.getElementById('attractorBtn').classList.remove('active');
        });

        document.getElementById('clearWellsBtn').addEventListener('click', () => {
            state.wells = [];
            updateWellCounter();
        });

        document.getElementById('levelSelectBtn').addEventListener('click', () => {
            updateLevelGrid();
            document.getElementById('levelSelect').classList.add('show');
        });

        document.getElementById('closeLevelSelect').addEventListener('click', () => {
            document.getElementById('levelSelect').classList.remove('show');
        });

        canvas.addEventListener('click', (e) => {
            if (state.ballLaunched) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if clicking existing well
            for (let i = state.wells.length - 1; i >= 0; i--) {
                if (state.wells[i].contains(x, y)) {
                    // Right click to remove would be nice, but for now just select
                    state.selectedWell = state.wells[i];
                    return;
                }
            }

            // Add new well
            if (state.wells.length < state.maxWells) {
                const well = new GravityWell(x, y, state.wellMode);
                state.wells.push(well);
                state.selectedWell = well;
                updateWellCounter();
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Remove well on right click
            for (let i = state.wells.length - 1; i >= 0; i--) {
                if (state.wells[i].contains(x, y)) {
                    state.wells.splice(i, 1);
                    updateWellCounter();
                    return;
                }
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Adjust strength of hovered well
            for (const well of state.wells) {
                if (well.contains(x, y)) {
                    well.strength += e.deltaY > 0 ? -20 : 20;
                    well.strength = Math.max(PHYSICS.wellStrengthMin,
                                   Math.min(PHYSICS.wellStrengthMax, well.strength));
                    return;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                launchBall();
            } else if (e.code === 'KeyR') {
                resetLevel();
            }
        });

        function updateLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';

            for (let i = 0; i < levels.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn level-btn';
                btn.textContent = i + 1;

                if (state.completedLevels.has(i)) {
                    btn.classList.add('completed');
                }

                // Unlock first level and any level after a completed one
                const isUnlocked = i === 0 || state.completedLevels.has(i - 1) || state.completedLevels.has(i);

                if (!isUnlocked) {
                    btn.classList.add('locked');
                } else {
                    btn.addEventListener('click', () => {
                        loadLevel(i);
                        document.getElementById('levelSelect').classList.remove('show');
                    });
                }

                grid.appendChild(btn);
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.getElementById('attractorBtn').classList.add('active');
        loadLevel(0);
        gameLoop();

        console.log('Gravity Golf loaded! Use gravity wells to guide the ball to the goal.');
    </script>
</body>
</html>
